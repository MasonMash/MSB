name: Conformance failure
description: Report a verifier, canonicalization, identifier, or test-vector mismatch.
title: "[Conformance]: "
labels: ["conformance", "bug"]
body:
  - type: textarea
    id: environment
    attributes:
      label: Implementation and environment
      description: Implementation, version, runtime, and operating system.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal reproducible input
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
